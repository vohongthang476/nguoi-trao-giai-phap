<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kế hoạch thói quen — Người Trao Giải Pháp</title><style>:root{--n:#102F50;--r:#B4212B;--i:#F7F3EC;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--i);font:15px/1.55 system-ui;color:#172033}.w{width:min(900px,calc(100% - 28px));margin:28px auto}.card{background:#fff;border:1px solid #d9dee6;border-radius:18px;padding:20px;margin:14px 0}h1,h2{color:var(--n)}label{display:block;font-weight:800;color:var(--n);margin:9px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6de;border-radius:10px;font:inherit}textarea{min-height:90px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer}.note{background:#f8edee;border-left:4px solid var(--r);padding:12px;border-radius:0 10px 10px 0;color:#5f6874}.item{padding:10px 0;border-bottom:1px dashed #d9dee6}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><p><a href="index.html">← Về trang chính</a></p><section class="card"><h1>Kế hoạch thói quen sức khỏe</h1><div class="note"><b>Không phải công cụ chẩn đoán hoặc điều trị.</b> Chỉ giúp sắp xếp mục tiêu sinh hoạt chung. Nếu có bệnh, triệu chứng, thuốc hoặc chế độ điều trị, hãy làm theo chuyên môn y tế phù hợp.</div><div class="g"><div><label>Mục tiêu</label><select id="goal"><option>Vận động đều hơn</option><option>Ngủ đúng giờ hơn</option><option>Ăn uống có kế hoạch</option><option>Giảm thời gian ngồi lâu</option><option>Cân bằng sinh hoạt</option></select></div><div><label>Thời gian có thể dành mỗi ngày</label><select id="mins"><option value="10">10 phút</option><option value="20">20 phút</option><option value="30">30 phút</option><option value="45">45 phút</option><option value="60">60 phút</option></select></div></div><label>Khung giờ thuận tiện</label><input id="time" placeholder="Ví dụ: 6:00 sáng hoặc 17:30"><label>Ghi chú cá nhân không nhạy cảm</label><textarea id="note" placeholder="Ví dụ: thích đi bộ, muốn bắt đầu nhẹ nhàng..."></textarea><p><button class="btn" id="make">Tạo kế hoạch 7 ngày</button></p></section><section class="card"><h2>Kế hoạch tham khảo</h2><div id="out">Nhập lựa chọn rồi bấm tạo kế hoạch.</div></section></div><script>const $=x=>document.getElementById(x);$('make').onclick=()=>{const g=$('goal').value,m=+$('mins').value,t=$('time').value.trim()||'khung giờ phù hợp',n=$('note').value.trim();let act={"Vận động đều hơn":"vận động nhẹ phù hợp với khả năng của bạn","Ngủ đúng giờ hơn":"thực hiện một chuỗi thư giãn, giảm màn hình và chuẩn bị đi ngủ","Ăn uống có kế hoạch":"lên trước bữa ăn và ghi lại lựa chọn thực phẩm để tự quan sát","Giảm thời gian ngồi lâu":"đứng dậy, đi lại nhẹ và thay đổi tư thế","Cân bằng sinh hoạt":"dành thời gian cho vận động nhẹ, nghỉ ngơi và lập kế hoạch ngày"}[g];let h=`<p><b>Mục tiêu:</b> ${g}. Mỗi ngày khoảng ${m} phút, ưu tiên ${t}.</p>`;for(let d=1;d<=7;d++){let mm=d===1?Math.max(5,Math.round(m*.6)):d===2?Math.max(5,Math.round(m*.7)):d===3?Math.max(5,Math.round(m*.8)):m;h+=`<div class="item"><b>Ngày ${d}</b> — ${mm} phút: ${act}. ${d===7?'Cuối ngày, tự đánh giá điều gì phù hợp để duy trì tuần sau.':'Ghi một dòng ngắn về mức độ dễ thực hiện.'}</div>`}if(n)h+=`<p><b>Ghi chú của bạn:</b> ${n.replace(/[<>]/g,'')}</p>`;h+=`<p style="color:#667085;font-size:13px">Dừng hoạt động và tìm hỗ trợ y tế phù hợp nếu có triệu chứng đáng lo. Kế hoạch này không thay thế tư vấn chuyên môn.</p>`;$('out').innerHTML=h}</script></body></html>
