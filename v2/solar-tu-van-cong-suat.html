<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar — Tư vấn công suất sơ bộ | Người Trao Giải Pháp</title><style>:root{--n:#102F50;--d:#071A2D;--r:#B4212B;--i:#F7F3EC;--m:#667085;--l:#D9DEE6}*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui;background:var(--i);color:#172033}.c{width:min(980px,calc(100% - 28px));margin:auto}header{background:var(--d);color:#fff;padding:18px 0}header a{color:#fff;text-decoration:none}.hero{padding:48px 0 26px}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.05;color:var(--n);margin:0}.hero p{color:var(--m);font-size:17px}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-bottom:50px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:22px;box-shadow:0 12px 35px #102f500d}label{display:block;font-weight:800;color:var(--n);margin:12px 0 6px}input,select{width:100%;padding:11px;border:1px solid #cfd6de;border-radius:10px;font:inherit}.btn{width:100%;border:0;background:var(--r);color:#fff;font-weight:900;padding:13px;border-radius:11px;margin-top:18px;cursor:pointer}.out{background:linear-gradient(145deg,var(--d),var(--n));color:#fff}.out p{color:#ced8e3}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.k{background:#ffffff0d;border:1px solid #ffffff18;border-radius:12px;padding:13px}.k b{display:block;font-size:22px}.warn{margin-top:15px;padding:12px;background:#fff2;border-left:4px solid #e36a73;border-radius:8px;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="c"><a href="index.html">← Người Trao Giải Pháp</a></div></header><main class="c"><section class="hero"><h1>Tư vấn công suất điện mặt trời sơ bộ</h1><p>Nhập tiền điện và loại điện. Công cụ quy đổi nhu cầu để chọn nhóm công suất tham khảo trước khi khảo sát thực tế.</p></section><div class="grid"><form class="card" id="f"><label>Tiền điện trung bình / tháng (VNĐ)</label><input id="bill" type="number" min="100000" step="10000" value="2000000" required><label>Loại điện</label><select id="phase"><option value="1">1 pha</option><option value="3">3 pha</option></select><label>Mục tiêu</label><select id="goal"><option value="self">Giảm điện mua ban ngày / bám tải</option><option value="storage">Có lưu trữ dùng buổi tối</option></select><button class="btn">Tính phương án sơ bộ</button></form><section class="card out" id="out"><h2>Kết quả tham khảo</h2><p>Nhập thông tin bên trái để tính.</p></section></div></main><script>const packs={1:[6,8,10,12,15],3:[8,10,12,15,20,25,30]};function money(n){return Math.round(n).toLocaleString('vi-VN')+' đ'}document.getElementById('f').onsubmit=e=>{e.preventDefault();const bill=+document.getElementById('bill').value,ph=+document.getElementById('phase').value,g=document.getElementById('goal').value;if(!bill||bill<100000)return;/* Chỉ là quy đổi sàng lọc, không giả định đây là biểu giá EVN chính xác. */const assumed=3000;const monthly=bill/assumed;const daily=monthly/30;const solarKwhPerKwDay=3.5;const raw=daily/solarKwhPerKwDay;const arr=packs[ph];let kw=arr.find(x=>x>=raw*.72)||arr[arr.length-1];const est=kw*solarKwhPerKwDay*30;const panels=Math.ceil(kw*1000/600);const storage=g==='storage'?Math.max(10,Math.round(daily*.45)):0;document.getElementById('out').innerHTML=`<h2>Phương án sơ bộ</h2><div class="kpis"><div class="k"><small>Combo tham khảo</small><b>${kw} kWp</b></div><div class="k"><small>Tấm pin 600Wp</small><b>~${panels} tấm</b></div><div class="k"><small>Sản lượng quy ước</small><b>~${Math.round(est)} kWh/tháng</b></div><div class="k"><small>Lưu trữ gợi ý</small><b>${storage?storage+' kWh':'Chưa cần'}</b></div></div><p>Tiền điện nhập: <strong>${money(bill)}/tháng</strong>. Ưu tiên thiết kế theo phụ tải thực tế, đặc biệt khung giờ sử dụng điện.</p><div class="warn"><b>Lưu ý:</b> Đây là công cụ sàng lọc nhu cầu, không phải báo giá/kết luận kỹ thuật. Kết quả đang dùng giả định nội bộ 3.000đ/kWh và 3,5 kWh/kWp/ngày để ước lượng. Trước khi chốt cần hóa đơn điện, vị trí mái, hướng mái, bóng che, công suất tải, biểu giá điện áp dụng và khảo sát kỹ thuật.</div>`}</script></body></html>
